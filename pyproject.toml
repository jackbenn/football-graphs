[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-graphs"
version = "0.1.0"
description = "Graphing American football games, play by play"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = ["marimo>=0.25", "pytest>=9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: checks every game of a season, using the downloaded data"]

# re-run cells that use a module of the package when it changes
[tool.marimo.runtime]
auto_reload = "autorun"
